name: Research only - pinned native RNG on one original critical Glass case
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  fixed-native-rng:
    name: Verify 24 seeded-native trials against unchanged authored PR96 case
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Set up exact pinned native PhyDemo source
        run: npm run setup
      - name: Build existing original native test core without production edits
        run: node scripts/build.mjs --test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve original immutable PR96 native inputs JSON, not a rebuilt scene
        uses: actions/download-artifact@v4
        with:
          name: heldout-v9-native-profiles-research-only
          run-id: 43872962563
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: test-artifacts/source-pr96-original
      - name: Execute 24 fresh native processes with one fixed test-only scene RNG seed
        run: |
          node evaluation/fixed-native-rng-v1/run.mjs \
            test-artifacts/source-pr96-original/inputs.json
      - name: Validate same seed/config hashes and exact dyadic TAP-only callbacks
        run: python3 evaluation/fixed-native-rng-v1/exact-check.py
      - name: Preserve original source and output even if a research invariant fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-native-rng-onecase-research-v1
          path: |
            test-artifacts/source-pr96-original/
            test-artifacts/llm-authoring/fixed-native-rng-v1/
          if-no-files-found: warn
          retention-days: 14
