name: Temporary composition development transfer
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/composition-dev-transfer.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.head_ref == 'feature/finite-dielectric-composition' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - name: Package isolated development workspace without credentials
        run: |
          mkdir -p .runtime
          cp "$(command -v node)" .runtime/node
          git archive --format=tar HEAD > composition-workspace.tar
          tar -rf composition-workspace.tar vendor/ray-optics .runtime
          gzip composition-workspace.tar
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-composition-workspace
          path: composition-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
# Temporary development transport only. REMOVE before final review/merge.
