name: Parameter experiment checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - name: Bounded native sweeps and failure preservation
        run: node scripts/experiment-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameter-experiment-evidence
          path: test-artifacts/llm-authoring/experiment-acceptance/
          if-no-files-found: error
          retention-days: 14
