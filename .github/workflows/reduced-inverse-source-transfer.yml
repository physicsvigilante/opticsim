name: Temporary reduced-inverse original source transfer
# Source-only branch workflow. Remove before opening a PR.
on:
  push:
    branches: [feature/reduced-inverse-original-audit]
    paths: [.github/workflows/reduced-inverse-source-transfer.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Read exact user-provided original ZIP
        shell: bash
        run: |
          mkdir -p test-artifacts
          git fetch --no-tags origin d33b45226348d9b0c701f2a3e8b86dd1285de2d0
          git show d33b45226348d9b0c701f2a3e8b86dd1285de2d0:08_Ray_Optics_Explanations.zip > test-artifacts/source-08.zip
      - name: Extract six frozen Problems only, never Solutions
        run: node evaluation/reduced-inverse-original-v1/extract-images.mjs problems
      - uses: actions/upload-artifact@v4
        with:
          name: reduced-inverse-original-problems
          path: test-artifacts/reduced-inverse-original-problems/
          if-no-files-found: error
          retention-days: 1
