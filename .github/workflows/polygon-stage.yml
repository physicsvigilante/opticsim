name: Polygon integration verification (temporary feature-branch only)
on:
  push:
    branches: ['feature/convex-polygon-glass']
    paths: ['.github/workflows/polygon-stage.yml']
permissions:
  contents: read
jobs:
  polygon-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - name: Full Node suite and exact upstream pin
        shell: bash
        run: |
          mkdir -p test-artifacts/polygon-stage
          { git rev-parse HEAD; node --version; google-chrome --version; sha256sum upstream-pin.json; } > test-artifacts/polygon-stage/runtime.txt
          npm test | tee test-artifacts/polygon-stage/tests.log
      - run: npm run build
      - run: node scripts/polygon-dielectric-acceptance.mjs
      - run: node scripts/pack-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polygon-stage-evidence
          path: |
            test-artifacts/polygon-stage/
            test-artifacts/llm-authoring/polygon-dielectric/
          if-no-files-found: ignore
          retention-days: 7
