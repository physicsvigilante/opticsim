name: Private experiment recovery snapshot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/resume-experiment-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feature/result-preview-and-sweeps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve tracked source only, not archives, solutions, credentials or build output
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,copyFileSync,writeFileSync,readFileSync} from 'node:fs';
          import {dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const out='test-artifacts/recovery-source';
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(p=>p&&(/\.(js|mjs|json|md|html|css|yml)$/.test(p)||p==='.gitignore')&&!p.split('/').includes('Solutions'));
          const manifest={revision:process.env.GITHUB_SHA,files:{}};
          for(const p of files){mkdirSync(dirname(out+'/'+p),{recursive:true});copyFileSync(p,out+'/'+p);manifest.files[p]=createHash('sha256').update(readFileSync(p)).digest('hex');}
          writeFileSync(out+'/recovery-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: private-experiment-recovery-source
          path: test-artifacts/recovery-source/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
