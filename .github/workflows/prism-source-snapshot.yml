name: Prism development source snapshot (one-off)
on:
  push:
    branches: [feature/triangular-prism]
    paths: [.github/workflows/prism-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p test-artifacts/prism-source
          git archive --format=tar HEAD > test-artifacts/prism-source/source.tar
          git rev-parse HEAD > test-artifacts/prism-source/commit.txt
          git ls-tree -r HEAD > test-artifacts/prism-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prism-development-source
          path: test-artifacts/prism-source/
          retention-days: 1
          if-no-files-found: error
