name: Blocker reviewed candidate (temporary isolated branch)
on:
  push:
    branches: [review/blocker-hardening-tools]
    paths: [.github/workflows/blocker-audit-candidate.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Apply exact reviewed patch to frozen PR source, not main
        shell: bash
        run: |
          set -euo pipefail
          cp .review/blocker-hardening.patch "$RUNNER_TEMP/blocker-hardening.patch"
          echo "72c09325989dcae9403fae9cd1a66e099bfec04a62de987d76c96cb987584cc5  $RUNNER_TEMP/blocker-hardening.patch" | sha256sum --check
          git fetch --no-tags --depth=1 origin a9c766bf8925b67f7159f52c204138c6f8392802
          git checkout --detach a9c766bf8925b67f7159f52c204138c6f8392802
          git apply --check --unidiff-zero "$RUNNER_TEMP/blocker-hardening.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/blocker-hardening.patch"
          test "$(git write-tree)" = c90995c2c57b010f725d267ebf72d63430683738
          mkdir -p test-artifacts/blocker-review
          { git rev-parse HEAD; git write-tree; node --version; google-chrome --version; sha256sum upstream-pin.json; } > test-artifacts/blocker-review/runtime.txt
      - run: npm run setup
      - name: Full pinned-native regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee test-artifacts/blocker-review/node-tests.log
      - run: npm run build
      - run: node scripts/opaque-line-blocker-acceptance.mjs
      - run: node scripts/polygon-dielectric-acceptance.mjs
      - run: node scripts/opaque-line-blocker-browser.mjs
      - run: node scripts/polygon-dielectric-browser.mjs
      - run: node scripts/pack-demo.mjs
      - name: Publish tested candidate only; never move main or the PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = c90995c2c57b010f725d267ebf72d63430683738
          git -c user.name='Opticsim review' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix component ceiling and asynchronous result isolation; share native measurement snapshots'
          test "$(git rev-parse HEAD^{tree})" = c90995c2c57b010f725d267ebf72d63430683738
          git rev-parse HEAD > test-artifacts/blocker-review/source-sha.txt
          git rev-parse HEAD^{tree} > test-artifacts/blocker-review/source-tree.txt
          git push origin HEAD:refs/heads/review/blocker-hardening-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blocker-hardening-evidence
          path: |
            test-artifacts/blocker-review/
            test-artifacts/llm-authoring/opaque-line-blocker/
            test-artifacts/llm-authoring/polygon-dielectric/
            test-artifacts/browser-opaque-line-blocker/
            test-artifacts/browser-polygon-dielectric/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blocker-reviewed-viewer
          path: test-artifacts/demo-site/
          retention-days: 7
          if-no-files-found: error
