name: Temporary workbench source and core transfer
# Read-only implementation snapshot; remove before opening final PR.
on:
  push:
    branches: [feature/browser-exploration-workbench]
    paths: [.github/workflows/workbench-source-transfer.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: node scripts/build.mjs --test
      - name: Archive exact reviewed public source and pinned test core
        shell: bash
        run: |
          mkdir -p test-artifacts/workbench-snapshot
          git archive --format=tar.gz HEAD > test-artifacts/workbench-snapshot/source.tar.gz
          cp dist/test-core.cjs test-artifacts/workbench-snapshot/test-core.cjs
          git rev-parse HEAD > test-artifacts/workbench-snapshot/commit.txt
          sha256sum test-artifacts/workbench-snapshot/source.tar.gz test-artifacts/workbench-snapshot/test-core.cjs > test-artifacts/workbench-snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-source-snapshot
          path: test-artifacts/workbench-snapshot/
          if-no-files-found: error
          retention-days: 1
