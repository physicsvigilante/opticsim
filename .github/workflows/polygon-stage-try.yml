name: Polygon branch staging permission probe (temporary only)
on:
  push:
    branches: ['feature/convex-glass-polygon']
    paths: ['.github/workflows/polygon-stage-try.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test non-force feature-branch Git write, never main
        shell: bash
        run: |
          set -eu
          git config user.name "opticsim-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          echo "Temporary branch staging permission probe" > .polygon-stage-probe
          git add .polygon-stage-probe
          git commit -m "Temporary feature-branch write probe; remove before review"
          git push origin HEAD:refs/heads/feature/convex-glass-polygon
