name: Numerical ray reliability diagnostics
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - name: Compare native numerical modes and verify saved and console completion
        run: node scripts/numerical-audit-report-acceptance.mjs
      - name: Replay a qualified scene under explicitly selected native numerical modes
        run: node scripts/native-numerical-acceptance.mjs
      - name: Isolate native near-critical intersections against exact recorded-line geometry
        run: node scripts/grazing-intersection-probe.mjs
      - name: Compare experimental relative intersections without changing production tracing
        if: ${{ !cancelled() }}
        run: node scripts/relative-intersection-experiment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-reliability-evidence
          path: |
            test-artifacts/llm-authoring/numerical-reliability/
            test-artifacts/llm-authoring/numerical-replay-acceptance/
            test-artifacts/llm-authoring/grazing-intersection/
            test-artifacts/llm-authoring/relative-intersection/
          if-no-files-found: error
          retention-days: 14
