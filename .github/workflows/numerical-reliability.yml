name: Numerical ray reliability diagnostics
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - name: Compare explicit native weak-branch numerical modes
        run: node scripts/numerical-reliability-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-reliability-evidence
          path: test-artifacts/llm-authoring/numerical-reliability/
          if-no-files-found: error
          retention-days: 14
