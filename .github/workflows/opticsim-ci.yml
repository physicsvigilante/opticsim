name: Optical composition checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - name: Package isolated browser demo (no source/test bundles)
        run: node scripts/pack-demo.mjs
      - name: LLM authoring CLI with real native execution and revision guards
        run: node scripts/author-scene-acceptance.mjs
      - run: node skills/sim-ro-image-to-scene/scripts/check-scene.mjs scenes/three-lenses.json scenes/four-lenses.json test/fixtures/multilens-extreme.json scenes/mixed-two-lens-two-mirror.json scenes/mixed-reverse-source.json scenes/mixed-detectors.json scenes/mixed-detectors-reverse.json scenes/single-lens-detector.json scenes/plane-mirror-detector.json scenes/multi-source-mixed.json scenes/multi-source-four.json scenes/general-source-detector.json scenes/general-two-source-lens.json scenes/general-mirror-pair.json scenes/general-source-only.json --report test-artifacts/image-to-scene/multi-lens/checks.json
      - name: Browser acceptance with preinstalled Chrome
        run: node scripts/browser-acceptance.mjs
      - name: Hosted path/browser acceptance (no public deployment)
        run: node scripts/browser-acceptance.mjs --hosted-smoke
      - name: Upload tested, standalone static demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opticsim-demo-site
          path: test-artifacts/demo-site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-browser-evidence
          path: test-artifacts/browser-hosted-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-evidence
          path: test-artifacts/browser-acceptance/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composed-lens-evidence
          path: test-artifacts/image-to-scene/multi-lens/checks.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-authoring-evidence
          path: test-artifacts/llm-authoring/
          if-no-files-found: ignore
