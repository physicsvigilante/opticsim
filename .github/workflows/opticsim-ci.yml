name: Optical composition checks
on:
  push:
    branches: [design/bounded-multilens-trains]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - run: node skills/sim-ro-image-to-scene/scripts/check-scene.mjs scenes/three-lenses.json scenes/four-lenses.json --report test-artifacts/image-to-scene/multi-lens/checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composed-lens-evidence
          path: test-artifacts/image-to-scene/multi-lens/checks.json
          if-no-files-found: ignore
