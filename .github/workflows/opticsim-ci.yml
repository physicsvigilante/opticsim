name: Optical composition checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - name: Verify standalone static demo distribution
        run: node scripts/check-static-demo.mjs --report test-artifacts/static-demo/checks.json
      - name: Browser smoke test at GitHub Pages project subpath
        env:
          OPTICSIM_BASE_PATH: /opticsim/
        run: node scripts/browser-acceptance.mjs --demo-smoke
      - run: node skills/sim-ro-image-to-scene/scripts/check-scene.mjs scenes/three-lenses.json scenes/four-lenses.json test/fixtures/multilens-extreme.json scenes/mixed-two-lens-two-mirror.json scenes/mixed-reverse-source.json scenes/mixed-detectors.json scenes/mixed-detectors-reverse.json scenes/single-lens-detector.json scenes/plane-mirror-detector.json scenes/multi-source-mixed.json scenes/multi-source-four.json --report test-artifacts/image-to-scene/multi-lens/checks.json
      - name: Browser acceptance with preinstalled Chrome
        run: node scripts/browser-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-evidence
          path: test-artifacts/browser-acceptance/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composed-lens-evidence
          path: test-artifacts/image-to-scene/multi-lens/checks.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opticsim-static-demo-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-demo-acceptance-evidence
          path: |
            test-artifacts/static-demo/
            test-artifacts/browser-demo-smoke/
          if-no-files-found: ignore
