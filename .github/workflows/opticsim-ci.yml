name: Optical composition checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      # Hosted Ubuntu images can omit Chrome. Real-browser evidence is mandatory.
      # Action SHA pins a reviewed Chrome for Testing installer (v2.2.0).
      - name: Install Chrome for Testing
        id: browser
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
      - name: Require usable Chrome before native browser tests
        env:
          CHROME_PATH: ${{ steps.browser.outputs.chrome-path }}
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          printf 'OPTICSIM_CHROME=%s\n' "$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - name: Package isolated browser demo (no source/test bundles)
        run: node scripts/pack-demo.mjs
      - name: Native finite opaque stop and immutable position sweep
        run: node scripts/opaque-line-blocker-acceptance.mjs
      - name: Native circular opaque stop and immutable radius sweep
        run: node scripts/opaque-circle-blocker-acceptance.mjs
      - name: Native finite aperture and immutable opening-width sweep
        run: node scripts/finite-aperture-acceptance.mjs
      - name: Native v18 two thick lenses mirror and finite aperture public problem acceptance
        run: node scripts/native-thick-lens-aperture-acceptance.mjs
      - name: JEE-first v19 parallel beam native public problem workflow
        run: node scripts/jee-parallel-beam-acceptance.mjs
      - name: JEE-first v19 native parallel Beam real-Chrome edits and qualified reopen
        run: node scripts/jee-parallel-beam-browser.mjs
      - name: v20 JEE native two-offset-lens public qualified authoring
        run: node scripts/jee-parallel-two-lens-acceptance.mjs
      - name: v20 JEE native two-offset-lens real Chrome physical edit and qualified reopen
        run: node scripts/jee-parallel-two-lens-browser.mjs
      - name: v21 JEE native semicircular Glass public qualified authoring
        run: node scripts/jee-semicircular-beam-acceptance.mjs
      - name: v21 JEE semicircular Glass real Chrome physical edit and qualified reopen
        run: node scripts/jee-semicircular-beam-browser.mjs
      - name: v22 JEE finite native prism Beam public qualified authoring
        run: node scripts/jee-prism-beam-acceptance.mjs
      - name: v22 JEE finite native prism Beam real Chrome physical edit and qualified reopen
        run: node scripts/jee-prism-beam-browser.mjs
      - name: v23 JEE native full CircleGlass finite Beam public qualified authoring
        run: node scripts/jee-circle-beam-acceptance.mjs
      - name: v23 JEE native full CircleGlass finite Beam real Chrome physical edits and qualified reopen
        run: node scripts/jee-circle-beam-browser.mjs
      - name: v24 genuine curved-entry internal-observer public native authoring
        run: node scripts/jee-curved-entry-acceptance.mjs
      - name: v24 curved-entry real Chrome qualified import, physical edit, suppression and reopen
        run: node scripts/jee-curved-entry-browser.mjs
      - name: v25 GRIN strict square-root fixed-field native evidence and refusal cases
        run: node scripts/jee-bounded-grin-v25-acceptance.mjs
      - name: v25 GRIN real Chrome native numerical guard, physical edits, refusal and reopen
        run: node scripts/jee-bounded-grin-v25-browser.mjs
      - name: v26 native Beam with PlaneGlass and finite Mirror public qualified authoring
        run: node scripts/native-parallel-planar-mirror-v26-acceptance.mjs
      - name: v26 real Chrome Beam refraction return, physical edit, corner refusal and reopen
        run: node scripts/native-parallel-planar-mirror-v26-browser.mjs
      - name: v27 public native Beam two-plane slab and strictly separated Mirror return qualification
        run: node scripts/native-two-plane-mirror-v27-acceptance.mjs
      - name: v27 real Chrome two-face slab and Mirror physical edits, contact refusal, qualified reopen
        run: node scripts/native-two-plane-mirror-v27-browser.mjs
      - name: Opaque blocker browser edits, detector readings and qualified exports
        run: node scripts/opaque-line-blocker-browser.mjs
      - name: Public post-lens aperture authoring and real Chrome qualification
        run: |
          node scripts/run-problem.mjs examples/native-post-lens-aperture-v28.json --out test-artifacts/llm-authoring/post-lens-aperture
          node scripts/post-lens-aperture-browser.mjs
      - name: LLM authoring CLI with real native execution and revision guards
        run: node scripts/author-scene-acceptance.mjs
      - name: Evaluate deterministic LLM pilot controls against native tracing
        run: node scripts/llm-pilot-acceptance.mjs
      - name: Run six-question GPT-6 development attempt with real native evidence
        run: node scripts/real-lens-trial-acceptance.mjs
      - run: node skills/sim-ro-image-to-scene/scripts/check-scene.mjs scenes/three-lenses.json scenes/four-lenses.json test/fixtures/multilens-extreme.json scenes/mixed-two-lens-two-mirror.json scenes/mixed-reverse-source.json scenes/mixed-detectors.json scenes/mixed-detectors-reverse.json scenes/single-lens-detector.json scenes/plane-mirror-detector.json scenes/multi-source-mixed.json scenes/multi-source-four.json scenes/general-source-detector.json scenes/general-two-source-lens.json scenes/general-mirror-pair.json scenes/general-source-only.json --report test-artifacts/image-to-scene/multi-lens/checks.json
      - name: Browser acceptance with preinstalled Chrome
        run: node scripts/browser-acceptance.mjs
      - name: Hosted path/browser acceptance (no public deployment)
        run: node scripts/browser-acceptance.mjs --hosted-smoke
      - name: Upload tested, standalone static demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opticsim-demo-site
          path: test-artifacts/demo-site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-browser-evidence
          path: test-artifacts/browser-hosted-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opaque-blocker-evidence
          path: |
            test-artifacts/llm-authoring/opaque-line-blocker/
            test-artifacts/browser-opaque-line-blocker/
            test-artifacts/llm-authoring/finite-aperture/
            test-artifacts/llm-authoring/native-thick-lens-aperture-v18/
            test-artifacts/research-v18-secondary-corner/
            test-artifacts/llm-authoring/jee-parallel-beam-v19/
            test-artifacts/browser-jee-parallel-beam-v19/
            test-artifacts/llm-authoring/jee-parallel-two-lens-v20/
            test-artifacts/browser-jee-parallel-two-lens-v20/
            test-artifacts/llm-authoring/jee-semicircular-beam-v21/
            test-artifacts/browser-jee-semicircular-beam-v21/
            test-artifacts/llm-authoring/jee-prism-beam-v22/
            test-artifacts/browser-jee-prism-beam-v22/
            test-artifacts/llm-authoring/jee-circle-beam-v23/
            test-artifacts/browser-jee-circle-beam-v23/
            test-artifacts/llm-authoring/jee-curved-entry-v24/
            test-artifacts/browser-jee-curved-entry-v24/
            test-artifacts/llm-authoring/jee-bounded-grin-v25/
            test-artifacts/browser-jee-bounded-grin-v25/
            test-artifacts/llm-authoring/native-parallel-planar-mirror-v26/
            test-artifacts/browser-native-parallel-planar-mirror-v26/
            test-artifacts/llm-authoring/native-two-plane-mirror-v27/
            test-artifacts/browser-native-two-plane-mirror-v27/
            test-artifacts/browser-post-lens-aperture/
            test-artifacts/llm-authoring/native-two-plane-mirror-v27-research/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-evidence
          path: test-artifacts/browser-acceptance/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composed-lens-evidence
          path: test-artifacts/image-to-scene/multi-lens/checks.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-authoring-evidence
          path: test-artifacts/llm-authoring/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-pilot-evidence
          path: test-artifacts/llm-evaluation/control/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-lens-development-trial
          path: test-artifacts/llm-evaluation/real-lens-trial/
          if-no-files-found: ignore
