name: Planar refraction checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  refraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - name: Node regressions for all optical families
        shell: bash
        run: |
          mkdir -p test-artifacts/ci-refraction
          { git rev-parse HEAD; node --version; google-chrome --version; sha256sum upstream-pin.json; } > test-artifacts/ci-refraction/runtime.txt
          npm test | tee test-artifacts/ci-refraction/node-test.log
      - run: npm run build
      - name: Native planar refraction, qualified revision and angle sweep
        run: node scripts/planar-refraction-acceptance.mjs
      - name: Planar browser import, physical edits and export
        run: node scripts/planar-refraction-browser.mjs
      - name: Native circular region, negative controls and immutable radius sweep
        run: node scripts/circular-dielectric-acceptance.mjs
      - name: Circular browser import, physical edits, incomplete results and export
        run: node scripts/circular-dielectric-browser.mjs
      - name: Native finite prism, face events and vertex sweep
        run: node scripts/triangular-prism-acceptance.mjs
      - name: Prism browser edits, native TIR and qualified export
        run: node scripts/triangular-prism-browser.mjs
      - name: Native finite convex glass, strict geometry and immutable vertex sweep
        run: node scripts/polygon-dielectric-acceptance.mjs
      - name: Polygon viewer physical edits, real TIR and qualified exports
        run: node scripts/polygon-dielectric-browser.mjs
      - name: Native finite glass and external mirror composition, rejection and sweep
        run: node scripts/finite-composition-acceptance.mjs
      - name: Composition browser edits, misses, incomplete results and qualified exports
        run: node scripts/finite-composition-browser.mjs
      - name: Native two-mirror composition, qualified structural branches and sweep
        run: node scripts/two-mirror-composition-acceptance.mjs
      - name: Two-mirror browser edits, identity preservation and incomplete suppression
        run: node scripts/two-mirror-composition-browser.mjs
      - name: Native finite-shape composition and qualified shape replacement
        run: node scripts/finite-shape-composition-acceptance.mjs
      - name: Prism and quadrilateral composition browser edits and qualification
        run: node scripts/finite-shape-composition-browser.mjs
      - name: Package existing allowlisted static viewer (not a deployment)
        run: node scripts/pack-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planar-refraction-evidence
          path: |
            test-artifacts/ci-refraction/
            test-artifacts/llm-authoring/planar-refraction/
            test-artifacts/browser-planar-refraction/
            test-artifacts/llm-authoring/circular-dielectric/
            test-artifacts/browser-circular-dielectric/
            test-artifacts/llm-authoring/triangular-prism/
            test-artifacts/browser-triangular-prism/
            test-artifacts/llm-authoring/polygon-dielectric/
            test-artifacts/browser-polygon-dielectric/
            test-artifacts/llm-authoring/finite-composition/
            test-artifacts/browser-finite-composition/
            test-artifacts/llm-authoring/two-mirror-composition/
            test-artifacts/browser-two-mirror-composition/
            test-artifacts/llm-authoring/finite-shape-composition/
            test-artifacts/browser-finite-shape-composition/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opticsim-static-viewer-with-circular-dielectric
          path: test-artifacts/demo-site/
          if-no-files-found: error
          retention-days: 7
