name: Planar refraction checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  refraction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - name: Native refraction, qualified revision and angle sweep
        run: node scripts/planar-refraction-acceptance.mjs
      - name: Refraction browser import, physical edits and export
        run: node scripts/planar-refraction-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planar-refraction-evidence
          path: |
            test-artifacts/llm-authoring/planar-refraction/
            test-artifacts/browser-planar-refraction/
          if-no-files-found: error
          retention-days: 14
