name: Quasi-static source motion checks
on:
  pull_request:
    branches: [main, feature/curved-mirror-imaging]
  push:
    branches: [feature/quasi-static-source-motion]
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - run: node scripts/motion-acceptance.mjs
      - run: npm run build:motion
      - run: node scripts/pack-motion.mjs
      - run: node scripts/motion-browser.mjs
      - run: node scripts/motion-viewport-browser.mjs
      - run: node scripts/motion-audit-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-motion-evidence
          path: |
            test-artifacts/llm-authoring/source-motion/
            test-artifacts/browser-source-motion/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opticsim-moving-source-demo
          path: test-artifacts/motion-demo/
          if-no-files-found: error
          retention-days: 14
