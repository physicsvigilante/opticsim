name: Quasi-static source motion checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser runtime
        run: google-chrome --version
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - name: Full Node suite and exact checkout evidence
        shell: bash
        run: |
          mkdir -p test-artifacts/ci-source-motion
          { git rev-parse HEAD; node --version; google-chrome --version; sha256sum upstream-pin.json; } > test-artifacts/ci-source-motion/runtime.txt
          npm test | tee test-artifacts/ci-source-motion/node-test.log
      - run: node scripts/motion-acceptance.mjs
      - run: node scripts/motion-lens-acceptance.mjs
      - name: Replay preserved PR 29 first attempts without repair
        run: node scripts/lens-prospective-review.mjs
      - run: npm run build:motion
      - run: node scripts/pack-motion.mjs
      - run: node scripts/motion-browser.mjs
      - run: node scripts/motion-viewport-browser.mjs
      - run: node scripts/motion-audit-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-motion-evidence
          path: |
            test-artifacts/ci-source-motion/
            test-artifacts/llm-authoring/source-motion/
            test-artifacts/llm-authoring/lens-motion/
            test-artifacts/llm-authoring/lens-prospective/
            test-artifacts/browser-source-motion/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opticsim-moving-source-demo
          path: test-artifacts/motion-demo/
          if-no-files-found: error
          retention-days: 7
