name: Polygon source snapshot (temporary only)
on:
  push:
    branches: ['feature/convex-glass-polygon']
    paths: ['.github/workflows/polygon-source-snapshot.yml']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive verified complete source checkout, excluding git internals
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/polygon-snapshot
          tar --exclude=.git --exclude=test-artifacts --exclude=node_modules --exclude=vendor -cf test-artifacts/polygon-snapshot/source.tar .
          git rev-parse HEAD > test-artifacts/polygon-snapshot/head.txt
          sha256sum test-artifacts/polygon-snapshot/source.tar > test-artifacts/polygon-snapshot/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: polygon-source-snapshot
          path: test-artifacts/polygon-snapshot
          retention-days: 3
