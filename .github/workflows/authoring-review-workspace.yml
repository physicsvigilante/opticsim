name: Private authoring review workspace
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/authoring-review-workspace.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feature/qualified-authoring-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: node scripts/build.mjs --test
      - name: Copy tracked source only and five prespecified Problems images, never Solutions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,copyFileSync,readFileSync,writeFileSync} from 'node:fs';
          import {dirname} from 'node:path';
          import {readProblemPng,sha256} from './evaluation/llm-pilot-v1/independent-inference.mjs';
          const out='test-artifacts/authoring-review-workspace';
          const paths=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const manifest={revision:process.env.GITHUB_SHA,files:{}};
          for(const p of paths){
            if(!/\.(?:js|mjs|json|md|html|css|yml)$/.test(p)&&p!=='.gitignore')continue;
            if(p.split('/').includes('Solutions'))continue;
            mkdirSync(dirname(out+'/'+p),{recursive:true});copyFileSync(p,out+'/'+p);
            manifest.files[p]=sha256(readFileSync(p));
          }
          mkdirSync(out+'/dist',{recursive:true});copyFileSync('dist/test-core.cjs',out+'/dist/test-core.cjs');
          const archive=readFileSync('08_Ray_Optics_Explanations.zip');
          const archiveSha256=sha256(archive);
          if(archiveSha256!=='03fa29dc8a09f157692ea389354bc7393a96e49f792b60329164c03e56bc5939')throw Error('Archive mismatch');
          const selected=['002','003','005','009','011'];
          const cases=selected.map((n,i)=>{
            const problemPath='08_Ray_Optics_Explanations/07_Lens_Formula/Problems/'+n+'.png';
            const bytes=readProblemPng(archive,problemPath);
            mkdirSync(out+'/trial-inputs',{recursive:true});writeFileSync(out+'/trial-inputs/'+n+'.png',bytes);
            return {id:'H'+(i+1),problemPath,imageSha256:sha256(bytes)};
          });
          writeFileSync(out+'/trial-inputs/selection.json',JSON.stringify({archive:'08_Ray_Optics_Explanations.zip',archiveSha256,selectionRule:'Five fixed Lens Formula question IDs chosen before opening their images: 002,003,005,009,011. Not a representative or independent model benchmark.',solutionsRead:false,cases},null,2));
          writeFileSync(out+'/source-manifest.json',JSON.stringify(manifest,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: private-authoring-review-workspace
          path: test-artifacts/authoring-review-workspace/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
