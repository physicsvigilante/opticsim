name: Qualified authoring checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualified:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - name: Qualified create/revise and evidence guards
        run: node scripts/qualified-workflow-acceptance.mjs
      - name: Replay sealed five-problem development attempt (not a model benchmark)
        run: node scripts/five-problem-trial.mjs
      - name: Browser qualification import, edits, results and export
        run: node scripts/qualified-browser-acceptance.mjs
      - name: Three supported first requests, revisions and negative controls
        run: node scripts/supported-authoring-demos.mjs
      - name: Open, edit and reopen the three supported demonstrations in Chrome
        run: node scripts/supported-demo-browser.mjs
      - name: Replay sealed cross-family synthetic first attempts (same assistant, not a model benchmark)
        run: node evaluation/cross-family-prospective-v3/replay.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supported-authoring-demonstrations
          path: test-artifacts/llm-authoring/supported-demos/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-authoring-evidence
          path: |
            test-artifacts/qualified-workflow/
            test-artifacts/llm-authoring/
            test-artifacts/browser-qualified/
            test-artifacts/llm-evaluation/cross-family-v3/
          if-no-files-found: error
          retention-days: 14
