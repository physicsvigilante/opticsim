name: Private supported demo workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/supported-demo-workspace.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feature/supported-authoring-demos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: node scripts/build.mjs --test
      - run: npm run build
      - name: Copy tracked text and pinned build, excluding problem archives and images
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,copyFileSync,readFileSync,writeFileSync,cpSync} from 'node:fs';
          import {dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const out='test-artifacts/supported-demo-workspace';
          const manifest={revision:process.env.GITHUB_SHA,files:{}};
          for(const p of execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            if(!/\.(?:js|mjs|json|md|html|css|yml)$/.test(p)&&p!=='.gitignore')continue;
            if(p.split('/').includes('Solutions'))continue;
            mkdirSync(dirname(out+'/'+p),{recursive:true});copyFileSync(p,out+'/'+p);
            manifest.files[p]=createHash('sha256').update(readFileSync(p)).digest('hex');
          }
          cpSync('dist',out+'/dist',{recursive:true});
          writeFileSync(out+'/source-manifest.json',JSON.stringify(manifest,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: private-supported-demo-workspace
          path: test-artifacts/supported-demo-workspace/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
