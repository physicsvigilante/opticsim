name: Unified problem workflow checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unified:
    # Explicit image: Ubuntu 26.04 rollout sometimes lacks a Chrome/Chromium executable.
    # All real-browser evidence remains mandatory; never turn missing Chrome into a pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: npm test
      - name: Verify v9 finite-hit diagnostic through ordinary public problem workflow
        run: node scripts/finite-hit-diagnostic-acceptance.mjs
      - name: Retain native finite-hit diagnostic raw and performance evidence even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-hit-diagnostic-v1-public
          path: test-artifacts/llm-authoring/finite-hit-diagnostic-v1/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify requested native detector ray parentage using public problem workflow
        run: node scripts/native-ray-parentage-acceptance.mjs
      - name: Retain bounded source-parentage native evidence even on failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ray-parentage-v1-evidence
          path: test-artifacts/llm-authoring/native-ray-parentage-v1/
          if-no-files-found: warn
          retention-days: 14
      - name: Teaching-fidelity source preservation and native physical checks
        run: node evaluation/teaching-fidelity-v1/run.mjs
      - name: Exercise one immutable model across physically validated teacher scenarios
        run: node evaluation/reusable-model-v1/run.mjs
      - name: Verify hash-guarded structural revisions through the qualified native CLI
        run: node scripts/structural-revision-acceptance.mjs
      - name: Record frozen cross-family revision decisions without repairing them
        run: node evaluation/revision-transfer-v1/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-transfer-evidence
          path: test-artifacts/llm-authoring/revision-transfer-v1/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-revision-evidence
          path: test-artifacts/llm-authoring/structural-revision-v1/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reusable-model-exploration-evidence
          path: test-artifacts/llm-authoring/reusable-model-v1/
          if-no-files-found: error
          retention-days: 14
      - name: Build unchanged existing browser for teaching tasks
        run: npm run build
      - name: Verify bounded native detector-hit positions in public problem workflow
        run: node scripts/detector-hit-acceptance.mjs
      - name: Exercise existing teaching controls in actual Chrome
        run: node evaluation/teaching-fidelity-v1/browser.mjs
      - name: Exercise practical model exploration in actual Chrome
        run: node scripts/exploration-browser.mjs
      - name: Exercise qualified native detector-hit events in actual Chrome
        run: node scripts/detector-hit-browser.mjs
      - name: Verify native ray parentage provenance in actual Chrome
        run: node scripts/native-ray-parentage-browser.mjs
      - name: Verify optional noncertifying v9 finite-hit diagnostic in actual Chrome
        run: node scripts/finite-hit-diagnostic-browser.mjs
      - name: Retain real-Chrome numerical diagnostic screenshots and readout evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-hit-diagnostic-v1-browser
          path: test-artifacts/browser-finite-hit-diagnostic-v1/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain real-Chrome ray parentage review evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ray-parentage-v1-browser
          path: test-artifacts/browser-ray-parentage/
          if-no-files-found: warn
          retention-days: 14

      - name: Package the local viewer (no public deployment)
        run: node scripts/pack-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-exploration-workbench
          path: |
            test-artifacts/browser-exploration/
            test-artifacts/browser-detector-hit/
            test-artifacts/demo-site/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-fidelity-evidence
          path: test-artifacts/llm-authoring/teaching-fidelity-v1/
          if-no-files-found: error
          retention-days: 14
      - name: Run five synthetic and existing integration controls
        run: node scripts/unified-problem-acceptance.mjs
      - name: Stress generality across 21 fixed synthetic authored scenes
        run: node scripts/general-composition-acceptance.mjs
      - name: Audit exact task-method suitability on frozen software and original development inputs
        run: node scripts/method-suitability-acceptance.mjs
      - name: Verify reduced forward lens facts without native scene assumptions
        run: node scripts/lens-train-acceptance.mjs
      - name: Verify reduced prism angles and qualified index ambiguity without native execution
        run: node scripts/prism-angle-acceptance.mjs
      - name: Cross-check prism angular facts against separately declared native apparatuses
        run: node scripts/prism-native-acceptance.mjs
      - name: Run reduced inverse fact controls without native execution
        run: node scripts/reduced-inverse-acceptance.mjs
      - name: Replay six frozen original inverse-scope requests, without image substitution
        run: node evaluation/reduced-inverse-original-v1/replay.mjs
      - name: Replay three GPT-6 same-chat authored first attempts (not independent)
        run: node evaluation/self-reviewed-pilot-v1/replay.mjs
      - name: Replay ten frozen original problems without answer substitution
        run: node evaluation/real-ten-v1/replay.mjs
      - name: Replay six sealed original-image first attempts without repairs
        run: node scripts/unified-original-trial.mjs
      - name: Preserve source fingerprints and separate review
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,copyFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const out='test-artifacts/llm-authoring/unified-original-trial';
          const files=['src/problem-workflow.js','scripts/run-problem.mjs','scripts/planar-angle-query.mjs','src/planar-angle-queries.js','src/adapter.js','src/observables.js','upstream-pin.json','dist/test-core.cjs'];
          const hashes=Object.fromEntries(files.map(p=>[p,createHash('sha256').update(readFileSync(p)).digest('hex')]));
          writeFileSync(out+'/execution-provenance.json',JSON.stringify({checkoutSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,node:process.version,sourceSha256:hashes},null,2)+'\n',{flag:'wx'});
          copyFileSync('evaluation/unified-workflow-v1/REVIEW.md',out+'/REVIEW.md');
          copyFileSync('docs/UNIFIED-PROBLEM-WORKFLOW.md',out+'/GUIDE.md');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-workflow-evidence
          path: |
            test-artifacts/llm-authoring/unified-acceptance/
            test-artifacts/llm-authoring/unified-original-trial/
            test-artifacts/llm-authoring/general-composition-v1/
            test-artifacts/llm-authoring/method-suitability-v1/
            test-artifacts/llm-authoring/lens-train-facts-v1/
            test-artifacts/llm-authoring/detector-hit-events-v2/
            test-artifacts/llm-authoring/prism-angle-facts-v1/
            test-artifacts/llm-authoring/prism-native-facts-v1/
            test-artifacts/llm-authoring/reduced-inverse/
            test-artifacts/llm-authoring/reduced-inverse-original-v1/
            test-artifacts/llm-authoring/self-reviewed-pilot-v1/
            test-artifacts/llm-authoring/real-ten-v1/
          if-no-files-found: error
          retention-days: 14
