name: Private refraction audit workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/private-refraction-workspace.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feature/planar-refraction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run setup
      - run: node scripts/build.mjs --test
      - name: Copy tracked code and pinned native source, without problem archives or secrets
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,copyFileSync,cpSync,writeFileSync} from 'node:fs';
          import {dirname} from 'node:path';
          const out='test-artifacts/refraction-workspace';
          for(const p of execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            if(!/\.(js|mjs|json|md|html|css|yml)$/.test(p)&&p!=='.gitignore')continue;
            if(p.split('/').includes('Solutions'))continue;
            mkdirSync(dirname(out+'/'+p),{recursive:true});copyFileSync(p,out+'/'+p);
          }
          mkdirSync(out+'/dist',{recursive:true});copyFileSync('dist/test-core.cjs',out+'/dist/test-core.cjs');
          cpSync('vendor/ray-optics/src',out+'/vendor/ray-optics/src',{recursive:true});
          copyFileSync('vendor/ray-optics/package.json',out+'/vendor/ray-optics/package.json');
          copyFileSync('vendor/ray-optics/LICENSE',out+'/vendor/ray-optics/LICENSE');
          writeFileSync(out+'/snapshot.json',JSON.stringify({head:process.env.GITHUB_SHA,native:execFileSync('git',['rev-parse','HEAD'],{cwd:'vendor/ray-optics',encoding:'utf8'}).trim()}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: private-refraction-workspace
          path: test-artifacts/refraction-workspace/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
