name: JEE Atlas source snapshot (temporary, feature branch only)
on:
  push:
    branches: ['feature/jee-optical-systems-atlas']
    paths: ['.github/workflows/atlas-source-snapshot.yml']
permissions:
  contents: read
jobs:
  fetch-problems:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve exact public Problems archive without Solutions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d33b45226348d9b0c701f2a3e8b86dd1285de2d0
          mkdir -p test-artifacts/atlas-transfer
          git show d33b45226348d9b0c701f2a3e8b86dd1285de2d0:08_Ray_Optics_Explanations.zip > test-artifacts/atlas-transfer/source.zip
          echo "03fa29dc8a09f157692ea389354bc7393a96e49f792b60329164c03e56bc5939  test-artifacts/atlas-transfer/source.zip" | sha256sum --check
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib,collections
          root=pathlib.Path("test-artifacts/atlas-transfer")
          original=root/"source.zip"
          output=root/"problems-only.zip"
          manifest=[]
          with zipfile.ZipFile(original) as src,zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as dst:
              for item in src.infolist():
                  path=item.filename
                  if item.is_dir(): continue
                  if not ("/Problems/" in path and path.lower().endswith(".png")):
                      continue
                  if "/Solutions/" in path or ".." in path.split("/") or path.startswith("/"):
                      raise ValueError("Unsafe or non-Problem member")
                  data=src.read(item)
                  if not data.startswith(b"\x89PNG\r\n\x1a\n"): raise ValueError("Non-PNG Problem member")
                  digest=hashlib.sha256(data).hexdigest()
                  dst.writestr(path,data)
                  manifest.append({"path":path,"sha256":digest,"bytes":len(data)})
          chapters=collections.Counter(x["path"].split("/Problems/")[0] for x in manifest)
          assert len(chapters)==8,chapters
          (root/"problem-inventory.json").write_text(json.dumps({
            "format":"opticsim-jee-atlas-source-transport-v1",
            "originalArchiveSha256":"03fa29dc8a09f157692ea389354bc7393a96e49f792b60329164c03e56bc5939",
            "sourceCommit":"d33b45226348d9b0c701f2a3e8b86dd1285de2d0",
            "count":len(manifest),"chapters":dict(sorted(chapters.items())),"members":manifest
          },indent=2)+"\n")
          print("Transport prepared: Problems-only",len(manifest),"PNG files in",len(chapters),"chapters")
          PY
          rm test-artifacts/atlas-transfer/source.zip
      - name: Upload Problems-only images for offline atlas review (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: jee-atlas-problems-only
          path: test-artifacts/atlas-transfer/
          retention-days: 7
          if-no-files-found: error
