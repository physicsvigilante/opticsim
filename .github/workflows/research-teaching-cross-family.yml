name: Research only - cross-family teacher task readiness and native browser proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  teaching-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Prepare unmodified pinned native PhyDemo
        run: npm run setup
      - name: Build original headless native test core
        run: node scripts/build.mjs --test
      - name: Reproduce three existing source-frozen families and qualified what-if packages
        run: node evaluation/teaching-cross-family-v1/run.mjs
      - name: Build existing browser unchanged
        run: npm run build
      - name: Real Chrome import edit Fit export reopen across three native families
        run: node evaluation/teaching-cross-family-v1/browser.mjs
      - name: Retain original source, native failures, qualified package and real Chrome evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-cross-family-evidence-v1
          path: test-artifacts/llm-authoring/teaching-cross-family-v1/
          if-no-files-found: warn
          retention-days: 14
