name: Blocker audit source snapshot (temporary)
on:
  push:
    branches: [review/blocker-hardening-tools]
    paths: [.github/workflows/blocker-audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9c766bf8925b67f7159f52c204138c6f8392802
          persist-credentials: false
      - name: Snapshot tracked code only (no problem archives, model call or native run)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/blocker-source
          git rev-parse HEAD > test-artifacts/blocker-source/commit.txt
          git rev-parse HEAD^{tree} > test-artifacts/blocker-source/tree.txt
          git archive --format=tar HEAD -- . ':!*.zip' > test-artifacts/blocker-source/source.tar
          sha256sum test-artifacts/blocker-source/source.tar > test-artifacts/blocker-source/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: blocker-audit-source
          path: test-artifacts/blocker-source/
          retention-days: 1
          if-no-files-found: error
