name: Curved mirror checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  curved:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      # Hosted Ubuntu images can omit Chrome. Real-browser evidence is mandatory.
      # Action SHA pins a reviewed Chrome for Testing installer (v2.2.0).
      - name: Install Chrome for Testing
        id: browser
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
      - name: Require usable Chrome before native browser tests
        env:
          CHROME_PATH: ${{ steps.browser.outputs.chrome-path }}
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          printf 'OPTICSIM_CHROME=%s\n' "$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run setup
      - run: npm test
      - name: Original follow-ups and native integration acceptance
        run: node scripts/curved-mirror-acceptance.mjs
      - run: npm run build
      - name: Actual curved mirror browser import edit export and reopen
        run: node scripts/curved-mirror-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curved-mirror-evidence
          path: |
            test-artifacts/llm-authoring/curved-mirrors/
            test-artifacts/browser-curved-mirrors/
          if-no-files-found: error
          retention-days: 14
