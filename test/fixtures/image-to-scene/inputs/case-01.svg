<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#50696b"/></marker></defs><rect width="900" height="440" fill="#fff"/><g font-family="Segoe UI,Arial,sans-serif" fill="#193d43" stroke-width="1.3"><text x="28" y="35" font-size="24">Point source and one ideal converging lens</text><text x="28" y="64" font-size="16">Schematic, not to scale. All labelled lengths are in cm.</text><line x1="55" y1="230" x2="845" y2="230" stroke="#788e93" stroke-dasharray="7 6"/><text x="812" y="220" font-size="18">+x</text><text x="750" y="255" font-size="14">axis</text><g stroke="#187d79" stroke-width="3"><line x1="540" y1="120" x2="540" y2="335" /><path d="M532 136 L540 120 L548 136 M532 319 L540 335 L548 319" fill="none"/></g><text x="496" y="98" font-size="18">L</text><text x="485" y="365" font-size="18">f = 8 cm</text><text x="460" y="390" font-size="16">aperture = 16 cm</text><circle cx="140" cy="175" r="6" fill="#c44f40"/><text x="105" y="155" font-size="17">S (isotropic point source)</text><line x1="140" y1="285" x2="540" y2="285" stroke="#50696b" marker-start="url(#a)" marker-end="url(#a)"/><text x="315" y="275" font-size="17">24 cm</text><line x1="110" y1="175" x2="110" y2="230" stroke="#50696b" marker-start="url(#a)" marker-end="url(#a)"/><text x="40" y="210" font-size="16">1.2 cm</text><g stroke="#c3a047" stroke-dasharray="5 5" fill="none"><line x1="140" y1="175" x2="540" y2="160" /><line x1="140" y1="175" x2="540" y2="250" /></g><text x="600" y="140" font-size="14">guide rays only</text><text x="28" y="428" font-size="14">Geometric-optics schematic. Read dimensions from labels, not pixel scale.</text></g></svg>
